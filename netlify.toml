[build]
  command = "npm run build"
  publish = "dist"

# SPA: qualquer rota profunda cai no index.html e o React Router resolve.
# Sem isso, recarregar a página em /entrar devolve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
